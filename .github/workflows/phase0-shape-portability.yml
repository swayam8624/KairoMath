name: Apply Phase 0 Shape Portability Patch

on:
  push:
    branches:
      - agent/phase0-portable-checkpoints

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase0-portable-checkpoints
          fetch-depth: 0
      - name: Replace module-fragile shape comparisons
        shell: python
        run: |
          from pathlib import Path
          path = Path('Tensor.cppm')
          source = path.read_text()
          replacements = {
              'm_strides == MakeContiguousStrides(m_shape)':
                  'std::ranges::equal(m_strides, MakeContiguousStrides(m_shape))',
              'lhs.GetShape() != rhs.GetShape()':
                  '!std::ranges::equal(lhs.GetShape(), rhs.GetShape())',
              'labels.GetShape() != probabilities.GetShape()':
                  '!std::ranges::equal(labels.GetShape(), probabilities.GetShape())',
              'predictions.GetShape() != labels.GetShape()':
                  '!std::ranges::equal(predictions.GetShape(), labels.GetShape())',
              'parameters.GetShape() != gradients.GetShape()':
                  '!std::ranges::equal(parameters.GetShape(), gradients.GetShape())',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'missing expected expression: {old}')
              source = source.replace(old, new)
          path.write_text(source)
          workflow = Path('.github/workflows/phase0-shape-portability.yml')
          workflow.unlink()
      - name: Commit portable comparisons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tensor.cppm .github/workflows/phase0-shape-portability.yml
          git commit -m "Fix portable tensor shape comparisons"
          git push origin HEAD:agent/phase0-portable-checkpoints
